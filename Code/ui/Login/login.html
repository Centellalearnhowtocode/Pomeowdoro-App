    <div class="remember">
      <input id="remmber" class="form-check mt-0" type="checkbox">
      <label for="remmber">I agree to <a href="">The term of use</a> of
      Use and <a href="">Privacy</a></label>

      <button  class="createaccoun1 mt-3 w-100 ">Create Account</button>
